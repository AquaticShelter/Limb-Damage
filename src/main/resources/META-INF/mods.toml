modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional integrations — enhance precision when present, never required.
# versionRange="[0,)" = any version: omitting versionRange does NOT mean "any" in Forge,
# it produces an unmatchable range that FAILS when the mod IS installed (the exact crash
# this line previously caused: "Mod limbdamage only supports tacz").
[[dependencies.${mod_id}]]
    modId="tacz"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="accuratehitboxes"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
